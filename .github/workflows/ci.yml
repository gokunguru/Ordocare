name: CI/CD Pipeline

on:
  push:
    branches: [main, dev, "feature/**", "refactor/**", "fix/**"]
  pull_request:
    branches: [main, dev]

jobs:

  lint:
    name: Lint (flake8 + isort + black)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend_django

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend_django/requirements.txt

      - name: Install lint tools
        run: pip install flake8 black==24.4.2 isort bandit

      - name: Run flake8
        run: |
          flake8 \
            --max-line-length=120 \
            --exclude=venv,migrations,__pycache__ \
            --ignore=E501,W292,E302,E305,E401,E402,E701,F401,F811,E301,W503,E261,E262,W391,E265 \
            .

      - name: Check black formatting
        run: black --check --line-length=120 --exclude='/(venv|migrations)/' .

      - name: Check isort
        run: isort --check-only --profile black --skip venv --skip migrations .

      - name: Security check
        run: bandit -r . -ll


  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-test-secret-key
      FIELD_ENCRYPTION_KEY: "qTf3J8OuUi7NT2K2beo4o9IwrSc3GvXlnlr0HPC9LnU="
      DEBUG: "True"
      ENVIRONMENT: test
      TESSERACT_CMD: /usr/bin/tesseract

    defaults:
      run:
        working-directory: backend_django

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend_django/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra libmagic1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: |
          python -m pytest core/tests -v --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend_django/coverage.xml


  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Git SHA
        id: vars
        run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend_django
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ordocare-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ordocare-backend:${{ steps.vars.outputs.SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  build-ml:
            name: Build & Push ML Image
            runs-on: ubuntu-latest
            needs: [lint, test]
            if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        
            steps:
              - uses: actions/checkout@v4
        
              - name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3
        
              - name: Log in to Docker Hub
                uses: docker/login-action@v3
                with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
        
              - name: Extract Git SHA
                id: vars
                run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
        
              - name: Build and push ML image
                uses: docker/build-push-action@v5
                with:
                  context: ./ml_service
                  push: true
                  tags: |
                    ${{ secrets.DOCKERHUB_USERNAME }}/ordocare-ml:latest
                    ${{ secrets.DOCKERHUB_USERNAME }}/ordocare-ml:${{ steps.vars.outputs.SHA_SHORT }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max